# Local development credentials only. For anything shared, create this Secret
# out of band instead of committing real values.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  # Host is the Service name below; 5432 is the Service port.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
